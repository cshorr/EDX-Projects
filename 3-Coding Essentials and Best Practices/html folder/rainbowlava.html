  <canvas id="square" width="1300" height="800"></canvas>

    <div class="slider-container">
      <label for="speedSlider">Speed:</label>
      <input id="speedSlider" type="range" min="30" max="300" value="100" />
    </div>
  </div>

  <script>
    const canvas = document.getElementById("square");
    const ctx = canvas.getContext("2d");

    const canvasWidth = canvas.width;
    const canvasHeight = canvas.height;
    const squareSize = 600; // define a centered square size

    const step = 12;
    let animating = false;
    let animationFrame = null;
    let delay = 100;

    const colors = [
      "#FF0000", "#FF6600", "#FFFF00", "#00FF00", "#00CED1",
      "#00008B", "#9900FF", "#FF00FF", "#39FF14", "#FF1493",
      "#444444", "#D3D3D3", "#228B22", "#1E90FF", "#B22222",
      "#FF4500", "#DA70D6", "#00FA9A", "#8A2BE2", "#FFD700",
      "#9932CC", "#87CEEB"
    ];

    document.getElementById("speedSlider").addEventListener("input", (e) => {
      delay = parseInt(e.target.value);
    });

    function startAnimation() {
      if (animating) return;
      animating = true;
      loopLava();
    }

    function stopAnimation() {
      animating = false;
      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
      }
    }

    function loopLava() {
      if (!animating) return;

      ctx.clearRect(0, 0, canvasWidth, canvasHeight);

      const offsetX = (canvasWidth - squareSize) / 2;
      let pad = 0;
      const maxLayers = Math.floor(squareSize / (step * 2));

      for (let i = 0; i < maxLayers; i++) {
        const color = colors[i % colors.length];
        const boxSize = squareSize - pad * 2;

        ctx.fillStyle = color;
        ctx.fillRect(offsetX + pad, pad, boxSize, boxSize);
        pad += step;
      }

      // Optional: draw title in center
      ctx.font = "bold 48pt Arial";
      ctx.fillStyle = "white";
      ctx.textAlign = "center";
      ctx.fillText("Unicorn Lava Core", canvasWidth / 2, canvasHeight - 60);

      colors.push(colors.shift());

      setTimeout(() => {
        animationFrame = requestAnimationFrame(loopLava);
      }, delay);
    }
  </script>
</body>
